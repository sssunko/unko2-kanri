<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>データ読み込み</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI','Meiryo',sans-serif; background:#121212; color:#e0e0e0; padding:16px; font-size:13px; }
h2 { color:#bb86fc; margin-bottom:12px; font-size:15px; }
.sec { background:#1e1e1e; border-radius:8px; padding:14px; margin-bottom:10px; }
.sec-ttl { color:#bb86fc; font-weight:bold; margin-bottom:10px; font-size:13px; }
input[type=file] { color:#e0e0e0; width:100%; padding:8px; background:#2a2a2a; border:1px solid #444; border-radius:6px; cursor:pointer; }
.btn { padding:10px 20px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; font-size:13px; }
.btn-ok { background:#1565c0; color:#fff; }
.btn-ok:hover:not(:disabled) { background:#1976d2; }
.btn-ok:disabled { background:#333; color:#666; cursor:not-allowed; }
.btn-ng { background:#333; color:#ccc; }
.btn:active:not(:disabled) { transform:scale(0.93); filter:brightness(0.75); }
#bar { padding:8px 12px; border-radius:6px; margin-bottom:10px; font-size:12px; display:none; }
#bar.info { background:#1a237e; color:#90caf9; display:block; }
#bar.error { background:#4a1010; color:#ef9a9a; display:block; }
#bar.success { background:#1b5e20; color:#a5d6a7; display:block; }
.hidden { display:none; }
.sheet-btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.sbtn { padding:6px 14px; border:1px solid #555; border-radius:20px; background:#2a2a2a; color:#ccc; cursor:pointer; font-size:12px; }
.sbtn.active { border-color:#bb86fc; color:#fff; background:#4a148c; font-weight:bold; }
.map-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:10px; margin-bottom:12px; }
.map-item { background:#2a2a2a; padding:8px 12px; border-radius:6px; border:1px solid #444; display:flex; justify-content:space-between; align-items:center; }
.map-item label { font-weight:bold; color:#bb86fc; width:80px; flex-shrink:0; }
.map-item select { flex-grow:1; width:100%; padding:6px; background:#121212; color:#fff; border:1px solid #555; border-radius:4px; font-size:12px; }
.preview-wrap { max-height:300px; overflow-y:auto; border:1px solid #333; border-radius:6px; }
table.prev { width:100%; border-collapse:collapse; font-size:11px; }
table.prev th { background:#2a2a2a; color:#bb86fc; padding:6px; border:1px solid #444; position:sticky; top:0; white-space:nowrap; text-align:left; }
table.prev td { padding:5px 6px; border:1px solid #2c2c2c; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
table.prev tr:nth-child(even) td { background:#1a1a1a; }
table.prev tr.err td { background:rgba(211,47,47,0.1) !important; color:#ff5252; }
.footer { display:flex; gap:10px; justify-content:flex-end; margin-top:12px; }
</style>
</head>
<body>
<h2>📥 データ一括読込（ライブプレビュー版） ─ <?= sheetType === 'unkou' ? '運行シート' : sheetType === 'master' ? '自車専属マスタ' : 'マスタ' ?></h2>
<div id="bar"></div>

<div class="sec" id="s1">
  <div class="sec-ttl">① ファイルを選択</div>
  <label for="fi" style="display:block;margin-bottom:6px;font-size:12px;color:#aaa;">Excel (.xlsx/.xls) または CSV (.csv)</label>
  <input type="file" id="fi" accept=".xlsx,.xls,.csv">
</div>

<div class="sec hidden" id="s1b">
  <div class="sec-ttl">② 読み込むシートを選択　<span style="font-size:11px;color:#aaa;font-weight:normal;">（複数選択可）</span></div>
  <div class="sheet-btns" id="sbArea"></div>
  <button type="button" onclick="confirmSheetSelection()" style="margin-top:10px;width:100%;padding:10px;background:#1565c0;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;">▶ このシートで読み込む</button>
</div>

<div class="sec hidden" id="s2">
  <div class="sec-ttl">③ 列の紐づけ（ズレていたら直してください）</div>
  <p style="font-size:11px; color:#aaa; margin-bottom:10px;">※ドロップダウンを変えると、下のプレビューが即座に切り替わります。</p>
  <div class="map-grid" id="mapGrid"></div>
  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <button type="button" class="btn" style="background:#4a148c;color:#fff;font-size:12px;padding:7px 16px;" onclick="autoMapAll()">🔍 自動マッピング</button>
    <button type="button" class="btn" style="background:#444;color:#ccc;font-size:12px;padding:7px 16px;" onclick="resetMapping()">🗑️ リセット</button>
  </div>

  <div class="sec-ttl" style="margin-top:16px;">④ プレビュー確認</div>
  <div class="preview-wrap"><table class="prev" id="prevT"></table></div>
  <div id="rowCnt" style="margin-top:8px; font-size:12px; color:#aaa;"></div>
</div>

<div class="footer hidden" id="ft">
  <button type="button" class="btn btn-ng" onclick="resetAll()">やり直す</button>
  <button type="button" class="btn btn-ok" id="btnOk" onclick="doImport()">この内容で登録</button>
</div>

<script>
var ST = '<?= sheetType ?>';
var SSID = '<?= currentSsId ?>';
var wb = null, dict = [], rawJson = [], headerRow = 0, firstDataRow = 0, parsedRows = [], extractedYM = null, rowYMMap = [];
var fields = [];
var _getDefVal = null;

// 運送業Excelでよく使われる列名のフォールバック辞書（サーバー辞書に無い場合に使用）
var FALLBACK_ALIASES = {
  division:  ['区分','運行区分','自社外注','種別','自社/外注','区','配車区分','自他','外注区分','運行種別','種類','自外','協力','自社/他社','自社他社'],
  company:   ['会社名','業者名','業者','社名','委託先','下請','下請け','外注先','傭車先','傭車','協力会社','運送会社','協力業者名','傭車業者','運送業者','委託会社','外注会社','取引業者','傭車会社名'],
  ton:       ['トン数','積載量','規格','車格','t数','トン','積載トン','車格トン','規格t','積載t数','積載トン数','最大積載量','積載量t'],
  carType:   ['車種','車両種別','型式','車型','車輌種別','車両型式','ボディ型','ボディ','形状','タイプ','車輌タイプ','車両タイプ'],
  car:       ['車番','車番号','ナンバー','号車','車両番号','車輌番号','プレート','登録番号','車No','車no','ナンバープレート','車輌No','車両No','登録No','車両ナンバー'],
  driver:    ['乗務員','乗務員名','ドライバー','ドライバー名','運転手','運転者','氏名','担当者','担当','乗務者','乗務','配送員','配達員','乗務員氏名','運転者氏名','ドライバー氏名','担当乗務員','運行担当','配送担当','担当者名'],
  phone:     ['携帯番号','電話番号','TEL','tel','Tel','携帯','電話','連絡先','携帯電話','緊急連絡先','携帯No','携帯電話番号','緊急連絡','連絡電話','電話No'],
  signboard: ['看板名','看板','指示書名','案件名','荷印','荷印名','荷主看板','指示書','案件','仕事名','業務名','荷印記号'],
  date:      ['日付','運行日','配送日','実施日','年月日','配車日','出発日','月日','作業日','運行日付','実施年月日','運行年月日','配送年月日','出荷年月日','作業年月日','運送日','輸送日'],
  client:    ['荷主','荷主名','取引先','顧客名','顧客','お客様','客先','発注元','委託元','荷主先','荷主会社','荷主会社名','発注会社','顧客会社','依頼元','委託元会社','依頼主','発注者','荷送人'],
  pickPlace: ['積地','積込場所','積込先','発地','積込','出発地','仕出地','仕出','積み地','乗り場','集荷先','集荷','運行','発','起点','出発','集荷場所','積込み先','積場','集荷地','積込地'],
  dropPlace: ['降地','荷卸場所','荷卸先','着地','荷卸','到着地','仕向地','仕向','降り地','配送先','納品先','納入先','着','終点','配達場所','到着地点','荷降ろし先','着場','配送先住所','納品場所'],
  sales:     ['売上','運賃','貰い運賃','請求額','請求運賃','金額','収入','売上金額','売上額','請求金額','貰い','受取運賃','輸送費','運送料','収入金額','入金額','請求運送費'],
  tollReq:   ['請求高速','高速請求','高速代請求','高速費用請求','高速(請求)','高速代','高速','有料道路','道路代請求','ETC請求','道路料金','高速道路代'],
  tollReal:  ['実費高速','高速実費','高速費用','高速(実費)','高速代実費','高速実額','道路代実費','ETC実費','実費道路代'],
  payment:   ['支払い','支払','外注費','外注運賃','支払運賃','支払額','車払い','車にのみ','車払','傭車費','支払運賃額','外注料','傭車料','委託料','支払い額','車両費'],
  memo:      ['備考','メモ','特記','摘要','備考欄','連絡事項','注意事項','コメント','メモ欄','NOTE','note'],
};

function bar(msg, t) { var e=document.getElementById('bar'); e.className=t||'info'; e.innerText=msg; e.style.display='block'; }
function clrBar() { document.getElementById('bar').style.display = 'none'; }
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showSuccess(msg) {
  var d=document.createElement('div');
  d.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#4caf50;color:#fff;padding:24px 36px;border-radius:10px;font-size:18px;font-weight:bold;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.4);text-align:center;white-space:pre-line;cursor:pointer;';
  d.innerText=msg+'\n（タップで閉じる）';
  d.onclick=function(){d.remove();};
  document.body.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.remove(); },8000);
}
function nrm(s) { return String(s||'').toLowerCase().replace(/[\s　]/g,''); }

// ① ファイル読込
document.getElementById('fi').addEventListener('change', function(e) {
  var f = e.target.files[0]; if(!f) return;
  bar('Excelを読み込み中...','info'); hide('s1b'); hide('s2'); hide('ft');
  var r = new FileReader();
  r.onload = function(ev) {
    bar('シートを確認中...','info');
    rawBuf = ev.target.result;
    setTimeout(function(){
    try {
      var wbMeta = XLSX.read(new Uint8Array(rawBuf), {type:'array', bookSheets:true});
      if (wbMeta.SheetNames.length > 1) {
        document.getElementById('sbArea').innerHTML = wbMeta.SheetNames.map(function(n,i) {
          return '<button type="button" class="sbtn" data-sheet="'+esc(n)+'" onclick="toggleSh(this)">'+esc(n)+'</button>';
        }).join('');
        show('s1b'); clrBar();
        // 数字が含まれるシート名を自動選択
        var idx = -1;
        wbMeta.SheetNames.forEach(function(n,i){ if(idx<0 && /[0-9]/.test(n)) idx=i; });
        document.querySelectorAll('.sbtn')[idx>=0?idx:0].click();
      } else {
        document.getElementById('sbArea').innerHTML = '<button type="button" class="sbtn active" data-sheet="'+esc(wbMeta.SheetNames[0])+'">'+esc(wbMeta.SheetNames[0])+'</button>';
        loadSelectedSheets();
      }
    } catch(err) { bar('読込エラー: '+err.message, 'error'); }
    },0);
  };
  r.onerror = function(){ bar('ファイル読み込み失敗', 'error'); };
  r.readAsArrayBuffer(f);
});

// ② シート選択（複数選択可）
var _sheetCache = {};
function toggleSh(btn) {
  btn.classList.toggle('active');
}
function confirmSheetSelection() {
  bar('シートを解析中...', 'info');
  setTimeout(loadSelectedSheets, 0);
}
function loadSelectedSheets() {
  var activeBtns = Array.from(document.querySelectorAll('.sbtn.active'));
  if (activeBtns.length === 0) { hide('s2'); hide('ft'); clrBar(); return; }
  var names = activeBtns.map(function(b){ return b.dataset.sheet; });
  var uncached = names.filter(function(n){ return !_sheetCache[n]; });
  if (uncached.length > 0) {
    bar('データを読み込み中...','info');
    setTimeout(function(){
      uncached.forEach(function(name){
        var wbS = XLSX.read(new Uint8Array(rawBuf), {type:'array', cellDates:false, raw:true, sheets:[name]});
        _sheetCache[name] = XLSX.utils.sheet_to_json(wbS.Sheets[name], {header:1, raw:true, defval:''});
      });
      _doMergeAndLoad(names);
    }, 0);
  } else {
    _doMergeAndLoad(names);
  }
}
function _doMergeAndLoad(names) {
  var mergedRows = [], mergedYMs = [], firstHeader = 0;
  try {
    names.forEach(function(name, idx) {
      var shJson = _sheetCache[name];
      var ym = findYM(shJson, name);
      var hRow = findHeaderRow(shJson);
      if (idx === 0) {
        firstHeader = hRow; extractedYM = ym;
        for (var r = 0; r < shJson.length; r++) { mergedRows.push(shJson[r]); mergedYMs.push(ym); }
      } else {
        var fdr = hRow + 1;
        while (fdr < shJson.length && !shJson[fdr].some(function(c){return String(c).trim();})) fdr++;
        for (var r = fdr; r < shJson.length; r++) { mergedRows.push(shJson[r]); mergedYMs.push(ym); }
      }
    });
  } catch(err) { bar('シート解析エラー: '+err.message, 'error'); return; }
  if (mergedRows.length < 2) { bar('データが空です', 'error'); return; }
  rawJson = mergedRows; rowYMMap = mergedYMs;
  headerRow = firstHeader;
  firstDataRow = headerRow + 1;
  while (firstDataRow < rawJson.length && !rawJson[firstDataRow].some(function(c){return String(c).trim();})) firstDataRow++;
  bar('辞書と照合中... ('+names.length+'シート)', 'info');
  google.script.run
    .withSuccessHandler(function(d){ dict = d||[]; buildMappingUI(); })
    .withFailureHandler(function(){ dict = []; buildMappingUI(); })
    .getImportDictionary(ST, SSID);
}

// ヘッダー行を特定（キーワードスコア最大の行を選ぶ — タイトル行への誤検知を防ぐ）
function findHeaderRow(json) {
  var KWS = ['車番','乗務員','ドライバー','運転手','荷主','積地','降地','売上','氏名','運賃',
             '名前','業者','携帯','電話','日付','看板','支払','貰い','高速','運行','会社'];
  var bestScore = 0, bestRow = 0;
  for(var i=0; i<Math.min(10, json.length); i++) {
    var rowStr = (json[i]||[]).map(function(x){return String(x||'');}).join('');
    var score = KWS.filter(function(k){ return rowStr.indexOf(k)!==-1; }).length;
    if(score > bestScore) { bestScore = score; bestRow = i; }
  }
  if(bestScore > 0) return bestRow;
  // キーワードが全く無ければ非空セル数最多にフォールバック
  var best = 0, max = 0;
  for(var i=0; i<Math.min(10, json.length); i++) {
    var c = (json[i]||[]).filter(function(x){return String(x).trim();}).length;
    if(c > max) { max = c; best = i; }
  }
  return best;
}

// シート名や上部から年月・日を抽出
function findYM(json, shName) {
  var res = { y: new Date().getFullYear(), m: new Date().getMonth()+1, d: '' };

  // シート名から日を抽出（例: "27日", "5"）
  var dMatch = shName.match(/^(\d+)日?$/);
  if (dMatch) res.d = parseInt(dMatch[1], 10);

  var txts = [shName];
  for(var i=0; i<Math.min(10, json.length); i++) {
    (json[i]||[]).forEach(function(x){
      // Excelシリアル値（40000〜50000 = 2009〜2036年相当）を実日付文字列に変換して追加
      var n = (typeof x === 'number') ? x : parseFloat(x);
      if(!isNaN(n) && n >= 40000 && n <= 50000) {
        var d = new Date((n - 25569) * 86400000);
        txts.push(d.getUTCFullYear()+'年'+(d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日');
      }
      txts.push(String(x||''));
    });
  }
  // 年付き年月パターンを優先検索
  var foundYM = false;
  for(var ti=0; ti<txts.length; ti++) {
    var s = txts[ti];
    var m1 = s.match(/令和\s*(\d+)\s*年\s*(\d+)\s*月/);
    if(m1){ res.y=2018+parseInt(m1[1]); res.m=parseInt(m1[2]); foundYM=true; break; }
    var m2 = s.match(/(20\d\d)\s*年\s*(\d+)\s*月/);
    if(m2){ res.y=parseInt(m2[1]); res.m=parseInt(m2[2]); foundYM=true; break; }
    var m3 = s.match(/(20\d\d)[\/\-](\d{1,2})/);
    if(m3){ res.y=parseInt(m3[1]); res.m=parseInt(m3[2]); foundYM=true; break; }
  }
  // スペース・スラッシュ区切りにも対応した月日抽出（スキャン範囲10行）
  if(!res.d) {
    var mdRe = /(?:20\d\d[年\/\-]|令和\d+年)?\s*(\d{1,2})\s*[月\/\-]\s*(\d{1,2})\s*日?/;
    for(var ti=0; ti<txts.length; ti++) {
      var m4 = txts[ti].match(mdRe);
      if(m4){ if(!foundYM) res.m=parseInt(m4[1]); res.d=parseInt(m4[2]); break; }
    }
  }
  return res;
}

// ③ マッピングUI構築
function buildMappingUI() {
  // 運行シート列順 + 支払い（集計表に直接書き込み）
  var priority = ['division','company','ton','carType','car','driver','phone','signboard','date','client','pickPlace','dropPlace','sales','tollReq','tollReal','payment'];
  fields = priority.map(function(fid){ return dict.find(function(e){return e.fieldId===fid;}); }).filter(Boolean);
  dict.forEach(function(e){ if(priority.indexOf(e.fieldId)<0) fields.push(e); });

  // 結合セルで空になる列に仮想列名を付与（エイリアス学習・キー生成を安定させる）
  var hdrs = (rawJson[headerRow] || []).map(function(h, c) {
    return String(h||'').replace(/\n/g,' ').trim() || ('【列'+c+'】');
  });
  var firstData = rawJson[firstDataRow] || [];

  var colOptions = '<option value="-1">-- 選択しない --</option><option value="AUTO">💡 シート上部から自動抽出</option>';
  for(var c=0; c<Math.max(hdrs.length, firstData.length); c++) {
    var letter = c < 26 ? String.fromCharCode(65+c) : String.fromCharCode(64+Math.floor(c/26))+String.fromCharCode(65+(c%26));
    var hText  = (hdrs[c] || ('【列'+c+'】')).substring(0,15);
    var _dRaw=firstData[c], _dN=parseFloat(_dRaw);
  var dText = (!isNaN(_dN)&&_dN>=40000&&_dN<=50000)
    ? (function(){var _sd=new Date((_dN-25569)*86400000);return(_sd.getUTCMonth()+1)+'/'+_sd.getUTCDate();})()
    : String(_dRaw||'').replace(/\n/g,' ').substring(0,12);
    var label  = '列'+letter+' ['+hText+']'+(dText?' 例:'+dText:'');
    colOptions += '<option value="'+c+'">'+esc(label)+'</option>';
  }

  // デフォルト値を計算する関数
  function getDefVal(fid) {
    var dv = '-1';
    var cleanAlias = function(a){ return !/^【列\d+】$/.test(String(a)); };

    // フィールドの表示名を取得
    var fieldObj = fields.find(function(f){ return f.fieldId===fid; });
    var dispName = fieldObj ? (fieldObj.dispName||'') : '';

    // コード系ヘッダー除外（住所コード・番号等）
    var isCodeHdr = function(h){ return /コード$|番号$|no\.?$|code$/i.test(String(h||'')); };

    // 名称系フィールド判定（会社名・社名・氏名・荷主など）
    var isNameField = /会社|社名|氏名|荷主|取引先|乗務員|担当|代表|名称|名前/.test(dispName)
                   || /company|client|driver|signboard/i.test(fid);

    // カナスキップ判定：名称系フィールドで「カナ列」は除外
    //   ① ヘッダーがカナ/フリガナ/よみ等で終わる
    //   ② firstDataが全カタカナ（漢字ゼロ）＝読み仮名列
    var isKanaSkip = function(c){
      if(!isNameField) return false;
      var h = String(hdrs[c]||'');
      if(/カナ$|かな$|フリガナ$|ふりがな$|よみ$|ヨミ$|読み$/.test(h)) return true;
      var v = String(firstData[c]||'').trim();
      // 全カタカナ（半角カナ含む）で漢字がない → 読み仮名列
      return v.length>0 && /^[ァ-ヶーｦ-ﾟ\s　・、]+$/.test(v);
    };

    var dEntry = dict.find(function(e){ return e.fieldId===fid; });

    // ① サーバー辞書 完全一致（コード系・カナ列除外）
    if(dEntry) {
      var aliases = dEntry.aliases.filter(cleanAlias);
      for(var c=0; c<hdrs.length; c++) {
        var hn=nrm(hdrs[c]);
        if(isCodeHdr(hdrs[c])||isKanaSkip(c)) continue;
        if(hn && aliases.some(function(a){ return nrm(a)===hn; })) { dv=c; break; }
      }
      // ② サーバー辞書 部分一致（コード系・カナ列除外）
      if(dv==='-1') {
        for(var c=0; c<hdrs.length; c++) {
          var hn=nrm(hdrs[c]);
          if(isCodeHdr(hdrs[c])||isKanaSkip(c)) continue;
          if(hn && aliases.some(function(a){ return nrm(a).length>1 && hn.indexOf(nrm(a))!==-1; })) { dv=c; break; }
        }
      }
    }
    // ③ フォールバック辞書 完全一致（コード系・カナ列除外）
    if(dv==='-1') {
      var fa=FALLBACK_ALIASES[fid]||[];
      for(var c=0; c<hdrs.length; c++) {
        var hn=nrm(hdrs[c]);
        if(isCodeHdr(hdrs[c])||isKanaSkip(c)) continue;
        if(hn && fa.some(function(a){ return nrm(a)===hn; })) { dv=c; break; }
      }
    }
    // ④ フォールバック辞書 部分一致（コード系・カナ列除外）
    if(dv==='-1') {
      var fa=FALLBACK_ALIASES[fid]||[];
      for(var c=0; c<hdrs.length; c++) {
        var hn=nrm(hdrs[c]);
        if(isCodeHdr(hdrs[c])||isKanaSkip(c)) continue;
        if(hn && fa.some(function(a){ return nrm(a).length>1 && hn.indexOf(nrm(a))!==-1; })) { dv=c; break; }
      }
    }

    // ⑤ データ値パターン検出（ヘッダーが空/未認識の列を値から判定）
    // トン数・車種：「13w」「4W」「13平」のような数字＋車種文字
    if((fid==='ton'||fid==='carType') && dv==='-1') {
      for(var c=0; c<firstData.length; c++) {
        var v=String(firstData[c]||'').replace(/[！-～]/g,function(ch){return String.fromCharCode(ch.charCodeAt(0)-0xFEE0);}).trim();
        if(/^\d+(?:\.\d+)?[a-zA-Z平ト]/.test(v)) { dv=c; break; }
      }
    }

    // 住所系フィールド：市区町村を含む文字列（数字始まり・〜のみは除外）
    var isAddrField = (fid==='pickPlace'||fid==='dropPlace')
                   || /住所|address/i.test(dispName);
    if(isAddrField && dv==='-1') {
      var addrRe=/[市区町村都道府県]/;
      var addrCols=[];
      for(var c=0; c<firstData.length; c++) {
        var v=String(firstData[c]||'').trim();
        if(addrRe.test(v) && !/^\d/.test(v) && v.replace(/[〜～\s]/g,'')) addrCols.push(c);
      }
      if(fid==='pickPlace' && addrCols.length>0) dv=addrCols[0];
      else if(fid==='dropPlace' && addrCols.length>1) dv=addrCols[1];
      else if(isAddrField && addrCols.length>0) dv=addrCols[0]; // 住所フィールド全般
    }

    // 乗務員名：漢字・ひらがな 2〜4文字で会社名マーカーなし
    if(fid==='driver' && dv==='-1') {
      var nmRe=/^[一-鿿぀-ゟ゠-ヿ]{2,4}$/;
      var cpRe=/[㈱㈲]|株式|有限|会社|本社|事務所/;
      for(var c=0; c<firstData.length; c++) {
        var v=String(firstData[c]||'').trim();
        if(nmRe.test(v) && !cpRe.test(v)) { dv=c; break; }
      }
    }

    // 〜を含む列（〜のみのセパレータ列は除外）
    if(fid==='pickPlace' && dv==='-1') {
      for(var c=0; c<firstData.length; c++) {
        var v=String(firstData[c]||'');
        if(/[〜～]/.test(v) && v.replace(/[〜～\s]/g,'')) { dv=c; break; }
      }
    }
    if(fid==='dropPlace' && dv==='-1') {
      for(var c=0; c<firstData.length; c++) {
        var v=String(firstData[c]||'');
        if(/[〜～]/.test(v) && v.replace(/[〜～\s]/g,'')) { dv=c; break; }
      }
    }

    if((fid==='date'||fid==='car'||fid==='driver') && dv==='-1') dv='AUTO';
    return dv;
  }
  _getDefVal = getDefVal; // 自動マッピングボタンから呼べるようにグローバルへ退避

  var html = '';
  fields.forEach(function(f) {
    html += '<div class="map-item"><label>'+esc(f.dispName)+'</label>'
          + '<select id="sel_'+f.fieldId+'" onchange="updatePreview()">'+colOptions+'</select></div>';
  });
  document.getElementById('mapGrid').innerHTML = html;

  // まずデフォルト値をセット
  fields.forEach(function(f){
    var sel = document.getElementById('sel_'+f.fieldId);
    var dv  = getDefVal(f.fieldId);
    var exists = Array.from(sel.options).some(function(o){return o.value==String(dv);});
    sel.value = exists ? String(dv) : '-1';
  });

  // 旧バグキー（SSID単体）の残骸を強制消去
  try { localStorage.removeItem('importMap_' + ST + '_' + SSID); } catch(e) {}

  // 前回の設定があれば上書き復元（同じ列構成なら自動反映）
  var saved = loadSavedMapping();
  if(saved) {
    fields.forEach(function(f){
      if(saved[f.fieldId] === undefined) return;
      var sel = document.getElementById('sel_'+f.fieldId);
      var exists = Array.from(sel.options).some(function(o){return o.value==String(saved[f.fieldId]);});
      if(exists) sel.value = String(saved[f.fieldId]);
    });
  }

  show('s2'); show('ft'); clrBar();
  updatePreview();
}

// ── マッピング保存・復元（localStorage）──────────────
function getMappingKey() {
  // 純粋な数値（日付シリアル値等）と空文字を除外した文字列ヘッダーのみでキーを生成
  // → 月が変わっても同じExcelフォーマットなら常に同じキーになる
  var sig = (rawJson[headerRow]||[])
              .map(function(h){ return String(h||'').trim(); })
              .filter(function(s){ return s && isNaN(Number(s)); })
              .slice(0, 10)
              .join('|');
  return 'importMap_' + ST + '_' + SSID + '_' + sig;
}
function saveMappingToLocal() {
  try {
    var key = getMappingKey();
    var map = {};
    fields.forEach(function(f){ map[f.fieldId] = document.getElementById('sel_'+f.fieldId).value; });
    localStorage.setItem(key, JSON.stringify(map));
  } catch(e) {}
}
function loadSavedMapping() {
  try {
    var saved = localStorage.getItem(getMappingKey());
    return saved ? JSON.parse(saved) : null;
  } catch(e) { return null; }
}

// ④ プレビューのリアルタイム更新
var _pvTimer = null, _pvGen = 0;
function updatePreview() {
  bar('プレビュー更新中...','info');
  clearTimeout(_pvTimer);
  _pvTimer = setTimeout(_doUpdatePreview, 0);
}
function _doUpdatePreview() {
  _pvGen++; var myGen = _pvGen;
  var map = {};
  fields.forEach(function(f){ map[f.fieldId] = document.getElementById('sel_'+f.fieldId).value; });

  // AUTOコンテキスト（ヘッダー上部から抽出）
  var autoCtx = { date: '', car: '', driver: '' };
  if(extractedYM) {
    autoCtx.date = extractedYM.d ? extractedYM.y+'/'+extractedYM.m+'/'+extractedYM.d
                                 : extractedYM.y+'/'+extractedYM.m+'/';
  }
  for(var i=0; i<headerRow; i++) {
    (rawJson[i]||[]).forEach(function(c){
      var s=String(c||'');
      var md=s.match(/(?:氏名|ドライバー|乗務員)\s*[：:]?\s*([^\s,，]{2,})/); if(md) autoCtx.driver=md[1].replace(/様|殿/g,'').trim();
      var mc=s.match(/(?:車番|車両|号車)\s*[：:]?\s*([^\s,，]{2,})/);       if(mc) autoCtx.car=mc[1].trim();
    });
  }

  // 列ヘッダーから日付を先読み（C列上部に「3月31日」等がある場合に対応）
  var colHeaderDate = {};
  for (var rh = 0; rh <= headerRow; rh++) {
    (rawJson[rh]||[]).forEach(function(cell, ci) {
      if (colHeaderDate[ci]) return;
      var s = String(cell||'').trim();
      var dm4 = s.match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
      if (dm4) { colHeaderDate[ci] = dm4[1]+'/'+parseInt(dm4[2])+'/'+parseInt(dm4[3]); return; }
      var dm2 = s.match(/(\d{1,2})月(\d{1,2})日/);
      if (dm2) { colHeaderDate[ci] = (extractedYM?extractedYM.y:new Date().getFullYear())+'/'+parseInt(dm2[1])+'/'+parseInt(dm2[2]); }
    });
  }

  parsedRows = [];
  var skipCount = 0;
  var prevValues = {}; // フィルダウン用（結合セル対策）

  function _pChunk(ri) {
    if(_pvGen !== myGen) return; // 新しい更新が走ったら即中断
    var _end = Math.min(ri + 150, rawJson.length);
    for(; ri < _end; ri++) {
      var row = rawJson[ri]||[];

      // ① エラー値（#N/A, #VALUE!, #REF!等）を空文字に変換したcleanRowを生成
      var cleanRow = row.map(function(c){
        var s = String(c||'');
        return /^#[A-Z\/!]+$/.test(s) ? '' : s;
      });

      // ② cleanRowが実質空なら完全スキップ
      if(cleanRow.join('').replace(/\s/g,'') === '') continue;

      // ③ 合計・総計・小計・累計・項目キーワード行をスキップ（先頭の非空セルで前方一致判定）
      var _firstNE = cleanRow.map(function(c){return String(c).trim();}).filter(Boolean)[0]||'';
      if(/^(合計|総計|小計|累計|項目)/.test(_firstNE)) { skipCount++; continue; }

      var rowYM = rowYMMap[ri] || extractedYM;
      var obj = {};
      fields.forEach(function(f){
        var v = map[f.fieldId];
        if(v==='AUTO') {
          if(f.fieldId==='date' && rowYM && rowYM.d) obj[f.fieldId] = rowYM.y+'/'+rowYM.m+'/'+rowYM.d;
          else obj[f.fieldId] = autoCtx[f.fieldId]||'';
        }
        else if(v!=='-1') obj[f.fieldId] = String(cleanRow[parseInt(v)]!==undefined?cleanRow[parseInt(v)]:'').trim();
        else              obj[f.fieldId] = '';
      });

      // 日付処理（数字 → 年月/日 補完）
      if(map.date!=='AUTO' && obj.date) {
        var serialN = parseFloat(obj.date);
        if(!isNaN(serialN) && serialN>=40000 && serialN<=50000) {
          // Excelシリアル値を実日付に変換（例: 46108 → 2026/3/27）
          var sd = new Date((serialN-25569)*86400000);
          obj.date = sd.getUTCFullYear()+'/'+(sd.getUTCMonth()+1)+'/'+sd.getUTCDate();
        } else {
          var dStr  = obj.date.split('(')[0].split('（')[0].trim();
          var pureN = parseInt(dStr.replace(/[^0-9]/g,''), 10);
          if(!isNaN(pureN) && pureN>=1 && pureN<=31 && dStr.indexOf('/')<0 && dStr.indexOf('-')<0 && rowYM) {
            obj.date = rowYM.y+'/'+rowYM.m+'/'+pureN;
          } else {
            obj.date = dStr;
          }
        }
      }
      // 日付が未取得 → 選択列のヘッダーまたはシート情報から補完
      if(!obj.date && map.date!=='-1') {
        var dci = (map.date==='AUTO') ? -1 : parseInt(map.date);
        if(dci>=0 && colHeaderDate[dci]) obj.date = colHeaderDate[dci];
        else if(rowYM && rowYM.d) obj.date = rowYM.y+'/'+rowYM.m+'/'+rowYM.d;
      }

      // テキスト項目の「0」を空欄扱い
      ['driver','car','pickPlace','dropPlace','client','division','carType','ton','phone','memo'].forEach(function(fid){
        if(obj[fid]==='0' || obj[fid]===0) obj[fid]='';
      });

      // フィルダウン（運行シートのみ・結合セル対策）
      if(ST === 'unkou') {
        // date/driver/car 以外のフィールドが全て空 → 書式だけのゴミ行と判定してスキップ
        var hasPayload = fields.some(function(f){
          return ['date','driver','car'].indexOf(f.fieldId) === -1 && String(obj[f.fieldId]||'').trim();
        });
        if(!hasPayload) { skipCount++; continue; }

        // date/driver/car が空なら直前の有効行の値を引き継ぐ
        ['date','driver','car'].forEach(function(fid){
          if(map[fid]==='-1'||map[fid]==='AUTO') return;
          if(obj[fid]) {
            prevValues[fid] = obj[fid];
          } else if(prevValues[fid]) {
            obj[fid] = prevValues[fid];
          }
        });
      }

      // 「13w」「１３Ｗ」→ トン数=13t / 車種=W に自動分割（全角→半角変換込み）
      function normHalf(s) {
        return String(s||'').replace(/[！-～]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); });
      }
      var tonRaw  = normHalf(obj.ton  || '');
      var typeRaw = normHalf(obj.carType || '');
      var tcSrc   = tonRaw || typeRaw;
      if(tcSrc) {
        var tcm = tcSrc.match(/^(\d+(?:\.\d+)?)\s*([a-zA-Z]*)/i);
        if(tcm) {
          if(obj.ton     !== undefined) obj.ton     = tcm[1] ? tcm[1]+'t' : '';
          if(obj.carType !== undefined) obj.carType = tcm[2] ? tcm[2].toUpperCase() : '';
        }
      }

      // 積地・降地が同じ列なら「〜」で分割
      if(map.pickPlace===map.dropPlace && map.pickPlace!=='-1' && map.pickPlace!=='AUTO') {
        var rv  = String(cleanRow[parseInt(map.pickPlace)]||'').trim();
        var pts = rv.split(/\s*[〜～]\s*/);
        if(pts.length>=2) { obj.pickPlace=pts[0].trim(); obj.dropPlace=pts.slice(1).join('〜').trim(); }
      } else if(obj.pickPlace && /[〜～]/.test(obj.pickPlace) && (map.dropPlace==='-1'||map.dropPlace==='AUTO')) {
        // 降地が未選択の時だけフォールバック分割（ユーザーが明示選択した場合は干渉しない）
        var pts2=obj.pickPlace.split(/\s*[〜～]\s*/);
        obj.pickPlace=pts2[0].trim();
        obj.dropPlace=pts2.slice(1).join('〜').trim();
      }

      parsedRows.push(obj);
    }
    if(_end < rawJson.length) {
      bar('プレビュー更新中... '+parsedRows.length+'件','info');
      setTimeout(function(){ _pChunk(_end); }, 0);
    } else {
      var showFids = fields.map(function(f){return f.fieldId;}).filter(function(f){return f!=='memo'&&f!=='tollReal';});
      var thead='<tr><th>#</th>'+showFids.map(function(f){
        var en=fields.find(function(x){return x.fieldId===f;});
        return '<th>'+(en?esc(en.dispName):f)+'</th>';
      }).join('')+'</tr>';
      var _prev=parsedRows.slice(0,50);
      var tbody=_prev.map(function(r,i){
        return '<tr><td style="color:#888">'+(i+1)+'</td>'
          +showFids.map(function(f){return '<td title="'+esc(r[f]||'')+'">'+esc(r[f]||'')+'</td>';}).join('')+'</tr>';
      }).join('');
      if(parsedRows.length>50) tbody+='<tr><td colspan="'+(showFids.length+1)+'" style="color:#888;text-align:center;padding:8px;">… 他 '+(parsedRows.length-50)+' 行（登録時に全件処理）</td></tr>';
      document.getElementById('prevT').innerHTML='<thead>'+thead+'</thead><tbody>'+tbody+'</tbody>';
      document.getElementById('rowCnt').innerHTML='抽出: <b>'+parsedRows.length+'</b> 行　スキップ: '+skipCount+' 行';
      document.getElementById('btnOk').disabled=(parsedRows.length===0);
      saveMappingToLocal(); // ドロップダウン変更のたびに即保存
    }
  }
  _pChunk(firstDataRow);
}

// ⑤ 登録実行
function doImport() {
  var validRows = parsedRows;
  if(validRows.length===0) return;
  document.getElementById('btnOk').disabled=true;
  bar('スプレッドシートに書き込み中（'+validRows.length+'件）...','info');
  // 今回の設定を保存（次回同じファイル構成で自動復元）
  saveMappingToLocal();

  var newAliases=[];
  fields.forEach(function(f){
    var colIdx=document.getElementById('sel_'+f.fieldId).value;
    if(colIdx==='-1'||colIdx==='AUTO') return;
    var hdrStr=String((rawJson[headerRow]||[])[parseInt(colIdx)]||'').replace(/\n/g,'').trim();
    if(!hdrStr) return; // 空ヘッダー列は辞書学習をスキップ（仮想列名による辞書汚染を防ぐ）
    var entry=dict.find(function(e){return e.fieldId===f.fieldId;});
    if(entry&&!entry.aliases.some(function(a){return nrm(a)===nrm(hdrStr);})) newAliases.push({fieldId:f.fieldId,alias:hdrStr});
  });

  var CHUNK=100,sent=0,_retry=0,total=validRows.length;
  var chunks=[];
  for(var _ci=0;_ci<total;_ci+=CHUNK) chunks.push(validRows.slice(_ci,_ci+CHUNK));
  function runImp(){
    if(sent>=chunks.length){
      bar('✅ '+total+'件 登録完了！','success');
      showSuccess('✅ '+total+'件\n登録完了！');
      document.getElementById('btnOk').disabled=false;
      hide('s1'); hide('s1b'); hide('s2'); hide('ft');
      return;
    }
    var isLast=sent===chunks.length-1;
    bar('📤 書込み中… '+Math.min((sent+1)*CHUNK,total)+'／'+total+'件','info');
    google.script.run
      .withSuccessHandler(function(){ sent++; _retry=0; runImp(); })
      .withFailureHandler(function(err){
        if(_retry<1){ _retry++; bar('書込みエラー。5秒後に再試行します…','info'); setTimeout(runImp,5000); return; }
        bar('❌ 登録エラー: '+(err.message||String(err)),'error');
        document.getElementById('btnOk').disabled=false;
      })
      .importBulkRows(ST,chunks[sent],SSID,isLast,isLast?validRows:null);
  }

  if(newAliases.length>0) {
    google.script.run
      .withSuccessHandler(runImp)
      .withFailureHandler(function(){ bar('列名の学習保存に失敗しました。取込は続行します。','info'); setTimeout(runImp,500); })
      .saveImportAliases(ST,newAliases,SSID);
  } else { runImp(); }
}

// 自動マッピング：辞書のエイリアスに基づいて全列を自動選択
function autoMapAll() {
  if(!_getDefVal) return;
  bar('マッピング中...','info');
  setTimeout(function(){
    fields.forEach(function(f){
      var dv = _getDefVal(f.fieldId);
      var sel = document.getElementById('sel_'+f.fieldId);
      var exists = Array.from(sel.options).some(function(o){ return o.value==String(dv); });
      if(exists) sel.value = String(dv);
    });
    updatePreview();
  },0);
}

// リセット：選択を全てデフォルトに戻し、保存済み設定を上書き
function resetMapping() {
  try { localStorage.removeItem(getMappingKey()); } catch(e) {}
  fields.forEach(function(f){
    var sel = document.getElementById('sel_'+f.fieldId);
    var isAuto = (f.fieldId==='date'||f.fieldId==='car'||f.fieldId==='driver');
    var autoExists = Array.from(sel.options).some(function(o){ return o.value==='AUTO'; });
    sel.value = (isAuto && autoExists) ? 'AUTO' : '-1';
  });
  updatePreview();
}

function resetAll() {
  document.getElementById('fi').value='';
  wb=null; rawBuf=null; _sheetCache={}; dict=[]; rawJson=[]; parsedRows=[]; extractedYM=null;
  hide('s1b'); hide('s2'); hide('ft'); clrBar(); show('s1');
}
