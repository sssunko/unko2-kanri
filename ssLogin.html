<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<!--
  ssLogin.html：客SSを開いた時のログイン画面（コード.js 2-6a で表示・2-6b でログイン）
  L-1: アドレス・パスワード・ログインしたままにする の入力
  L-2: ログイン送信（成功で閉じる／失敗でメッセージ）
-->
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; font-size: 13px; margin: 0; padding: 14px 16px; color: #222; }
  p.lead { margin: 0 0 12px; color: #555; line-height: 1.6; }
  label.f { display: block; font-weight: bold; margin: 8px 0 4px; }
  input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; border: 1px solid #bbb; border-radius: 4px; }
  .keep { display: flex; align-items: center; gap: 6px; margin: 12px 0 4px; cursor: pointer; }
  button { width: 100%; margin-top: 12px; padding: 10px; font-size: 14px; border: none; border-radius: 4px; background: #1565c0; color: #fff; cursor: pointer; }
  button:disabled { background: #90a4ae; }
  #msg { margin-top: 10px; color: #c62828; min-height: 18px; }
</style>
</head>
<body>
  <p class="lead">このスプレッドシートを使うには、ログインしてください。</p>
  <label class="f" for="em">メールアドレス</label>
  <input type="text" id="em" autocomplete="username">
  <label class="f" for="pw">パスワード</label>
  <input type="password" id="pw" autocomplete="current-password">
  <label class="keep"><input type="checkbox" id="keep" checked> ログインしたままにする</label>
  <button id="btn" onclick="doLogin()">ログイン</button>
  <div id="msg"></div>
<script>
// L-2: ログイン送信
function doLogin() {
  var em = document.getElementById('em').value.trim();
  var pw = document.getElementById('pw').value;
  var keep = document.getElementById('keep').checked;
  var msg = document.getElementById('msg');
  if (!em || !pw) { msg.textContent = 'メールアドレスとパスワードを入力してください'; return; }
  var btn = document.getElementById('btn');
  btn.disabled = true; msg.textContent = '確認中...';
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.ok) { google.script.host.close(); return; }
      btn.disabled = false;
      msg.textContent = (r && r.msg) ? r.msg : 'ログインできませんでした';
    })
    .withFailureHandler(function(e) {
      btn.disabled = false;
      msg.textContent = '通信エラー：' + (e && e.message ? e.message : '');
    })
    .loginSs(em, pw, keep);
}
document.getElementById('pw').addEventListener('keydown', function(ev) { if (ev.key === 'Enter') doLogin(); });
</script>
</body>
</html>
