<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'メイリオ',Meiryo,'ＭＳ 明朝',serif;background:#f5f5f5;font-size:10pt;}
.toolbar{background:#37474f;padding:10px 16px;display:flex;gap:10px;align-items:center;}
.toolbar span{color:#cfd8dc;font-size:12px;margin-right:auto;}
.tbtn{padding:7px 18px;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-weight:bold;}
.tbtn-print{background:#fff;color:#1565c0;}
.tbtn-email{background:#1565c0;color:#fff;}
.tbtn-fax{background:#6a1b9a;color:#fff;}
.tbtn-print:hover{background:#e3f2fd;}
.tbtn-email:hover{background:#1976d2;}
.tbtn-fax:hover{background:#7b1fa2;}
.tbtn-sent{background:#388e3c!important;color:#fff!important;cursor:default;}
.page{background:#fff;width:720px;margin:12px auto;padding:20px 24px;border:1px solid #bbb;box-shadow:0 2px 6px rgba(0,0,0,.15);}
.doc-title{text-align:center;font-size:18pt;font-weight:bold;letter-spacing:.3em;border-bottom:2px solid #333;padding-bottom:6px;margin-bottom:12px;}
.header-row{display:flex;justify-content:space-between;margin-bottom:14px;}
.recipient .company{font-size:14pt;font-weight:bold;border-bottom:1.5px solid #333;display:inline-block;min-width:260px;padding-bottom:2px;margin-bottom:4px;}
.recipient .attn{font-size:10pt;color:#555;margin-left:4px;}
.sender-box{text-align:right;font-size:9pt;line-height:1.9;}
.sender-box .s-name{font-size:11pt;font-weight:bold;}
.section{margin-bottom:10px;}
.sec-ttl{background:#455a64;color:#fff;padding:3px 10px;font-size:9.5pt;font-weight:bold;margin-bottom:0;}
table.doc-tbl{width:100%;border-collapse:collapse;font-size:9.5pt;}
table.doc-tbl th{background:#eceff1;border:1px solid #90a4ae;padding:5px 6px;text-align:center;font-weight:bold;white-space:nowrap;}
table.doc-tbl td{border:1px solid #90a4ae;padding:5px 8px;vertical-align:middle;min-height:26px;}
table.doc-tbl td[contenteditable]{cursor:text;outline:none;}
table.doc-tbl td[contenteditable]:focus{background:#fffde7;}
table.doc-tbl td.ctr{text-align:center;}
table.doc-tbl td.num{text-align:right;}
.footer-note{text-align:right;font-size:8pt;color:#888;margin-top:8px;}
@page{size:landscape;margin:0;}
@media print{
  .toolbar{display:none!important;}
  .sec-ttl button{display:none!important;}
  body{background:#fff;}
  .page{box-shadow:none;border:none;margin:0;padding:12px 16px;width:100%;}
}
</style>
</head>
<body>
<div class="toolbar">
  <span id="doc-type-label">帳票</span>
  <button type="button" class="tbtn tbtn-print" onclick="onPrint()">🖨️ 印刷 / PDF保存</button>
  <button type="button" class="tbtn tbtn-email" id="btn-email" onclick="onEmailSend()">✉️ メール送信</button>
  <button type="button" class="tbtn tbtn-fax"   id="btn-fax"   onclick="onFaxSend()">📠 FAX送信</button>
  <button type="button" class="tbtn" style="background:#546e7a;color:#fff;" onclick="requestClose()">✕ 閉じる</button>
</div>
<div class="page" id="page"></div>

<div id="close-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;"></div>
<div id="close-confirm" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:8px;padding:24px;z-index:1001;text-align:center;min-width:320px;box-shadow:0 4px 24px rgba(0,0,0,.4);">
  <p style="font-size:13px;margin-bottom:18px;">指示書の入力内容を保存しますか？</p>
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
    <button type="button" onclick="saveAndClose()" style="padding:8px 16px;background:#388e3c;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold;">💾 保存して閉じる</button>
    <button type="button" onclick="discardAndClose()" style="padding:8px 16px;background:#c62828;color:#fff;border:none;border-radius:4px;cursor:pointer;">保存せずに閉じる</button>
    <button type="button" onclick="cancelClose()" style="padding:8px 16px;background:#546e7a;color:#fff;border:none;border-radius:4px;cursor:pointer;">キャンセル</button>
  </div>
</div>
<div id="sh-overlay" onclick="closeHistory()" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:900;"></div>
<div id="sh-modal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:8px;padding:18px;min-width:540px;max-width:750px;max-height:70vh;overflow-y:auto;z-index:901;box-shadow:0 4px 24px rgba(0,0,0,.35);">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <b style="font-size:13px;">📋 指示先履歴</b>
    <button onclick="closeHistory()" style="border:none;background:none;cursor:pointer;font-size:18px;line-height:1;">✕</button>
  </div>
  <div id="sh-list"></div>
</div>

<script>
var DATA = <?!= docData ?>;
var TYPE = '<?!= docType ?>';

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMoney(v){
  if(!v && v!==0) return '';
  var n=parseFloat(String(v).replace(/[,¥￥\s]/g,''));
  return isNaN(n)?String(v):'¥'+n.toLocaleString();
}

function ce(val){ return ' contenteditable="true" data-orig="'+esc(val)+'"'; }

function buildDoc(d, isHatchu){
  var title     = isHatchu ? '発　注　書' : '車　番　連　絡';
  var recipient = isHatchu ? d.company    : d.client;
  var kinGaku   = isHatchu ? fmtMoney(d.payment) : fmtMoney(d.sales);

  // ヘッダー
  var html = '<div class="doc-title">'+esc(title)+'</div>'
    + '<div class="header-row">'
    + '<div class="recipient">'
    + '<div class="company" '+ce(recipient)+'>' + esc(recipient) + '</div>'
    + '<span class="attn">　御　中</span>'
    + '<div style="margin-top:8px;font-size:9pt;color:#555">下記の通りご連絡申し上げます。</div>'
    + '</div>'
    + '<div class="sender-box">'
    + '<div>発行日：<span '+ce(d.today)+'>'+esc(d.today)+'</span></div>'
    + '<div class="s-name" '+ce(d.selfName)+'>'+esc(d.selfName)+'</div>'
    + (d.selfZip  ? '<div>〒<span '+ce(d.selfZip)+'>'+esc(d.selfZip)+'</span>　<span '+ce(d.selfAddr)+'>'+esc(d.selfAddr)+'</span></div>' : '')
    + (d.selfTel  ? '<div>TEL：<span '+ce(d.selfTel)+'>'+esc(d.selfTel)+'</span>'+(d.selfFax?'　FAX：<span '+ce(d.selfFax)+'>'+esc(d.selfFax)+'</span>':'')+'</div>':'')
    + (d.selfPerson ? '<div>担当：<span '+ce(d.selfPerson)+'>'+esc(d.selfPerson)+'</span></div>' : '')
    + '</div>'
    + '</div>';

  // 1段目: 積日/曜日/積地/降日/曜日/降地
  html += '<div class="section"><div class="sec-ttl">■ 運行情報</div>'
    + '<table class="doc-tbl"><thead><tr>'
    + '<th style="width:8%">積　日</th><th style="width:5%">曜日</th><th style="width:18%">積　地</th>'
    + '<th style="width:8%">降　日</th><th style="width:5%">曜日</th><th style="width:18%">降　地</th>'
    + '</tr></thead><tbody><tr>'
    + '<td class="ctr"'+ce(d.dateStr)+'>'+esc(d.dateStr)+'</td>'
    + '<td class="ctr"'+ce(d.wdStr)+'>'+esc(d.wdStr)+'</td>'
    + '<td'+ce(d.pickPlace)+'>'+esc(d.pickPlace)+'</td>'
    + '<td class="ctr" contenteditable="true" data-orig="'+esc(d.dropDateStr)+'">'+esc(d.dropDateStr)+'</td>'
    + '<td class="ctr" contenteditable="true" data-orig="'+esc(d.dropWdStr)+'">'+esc(d.dropWdStr)+'</td>'
    + '<td'+ce(d.dropPlace)+'>'+esc(d.dropPlace)+'</td>'
    + '</tr></tbody></table></div>';

  // 2段目: 金額/装備その他（品名列は廃止）
  html += '<div class="section"><div class="sec-ttl">■ 詳細情報</div>'
    + '<table class="doc-tbl"><thead><tr>'
    + '<th style="width:16%">金　額</th>'
    + '<th>装備・その他</th>'
    + '</tr></thead><tbody><tr>'
    + '<td class="num"'+ce(kinGaku)+'>'+esc(kinGaku)+'</td>'
    + '<td'+ce(d.sobiSonota||d.memo)+'>'+esc(d.sobiSonota||d.memo)+'</td>'
    + '</tr></tbody></table></div>';

  // 2.5段目: 指示書（発注書のみ）
  if (isHatchu) {
    html += '<div class="section"><div class="sec-ttl" style="display:flex;align-items:center;gap:6px;">■ 指示書'
      + '<button type="button" id="btn-save-sj" onclick="onSaveShijisaki()" '
      + 'style="padding:2px 10px;font-size:10px;background:#388e3c;color:#fff;border:none;border-radius:3px;cursor:pointer;font-weight:bold;">💾 保存</button>'
      + '<button type="button" onclick="loadHistory()" '
      + 'style="padding:2px 10px;font-size:10px;background:#fff;color:#455a64;border:1px solid #90a4ae;border-radius:3px;cursor:pointer;font-weight:bold;">📋 履歴</button>'
      + '</div>'
      + '<table class="doc-tbl"><thead><tr>'
      + '<th style="width:25%">会社名</th><th style="width:20%">電話番号</th>'
      + '<th style="width:18%">担当者名</th><th>住所</th>'
      + '</tr></thead><tbody><tr>'
      + '<td id="sj-company" contenteditable="true" oninput="markUnsaved()"></td>'
      + '<td id="sj-tel" contenteditable="true" oninput="markUnsaved()"></td>'
      + '<td id="sj-person" contenteditable="true" oninput="markUnsaved()"></td>'
      + '<td id="sj-addr" contenteditable="true" oninput="markUnsaved()"></td>'
      + '</tr></tbody></table></div>';
  }

  // 3段目: 看板名/車番/乗務員名/携帯番号
  html += '<div class="section"><div class="sec-ttl">■ 車両・乗務員情報</div>'
    + '<table class="doc-tbl"><thead><tr>'
    + '<th style="width:8%">トン数</th><th style="width:9%">車　種</th>'
    + '<th style="width:16%">看板名</th><th style="width:13%">車　番</th>'
    + '<th style="width:16%">乗務員名</th><th>携帯番号</th>'
    + '</tr></thead><tbody><tr>'
    + '<td class="ctr"'+ce(d.ton)+'>'+esc(d.ton)+'</td>'
    + '<td class="ctr"'+ce(d.carType)+'>'+esc(d.carType)+'</td>'
    + '<td'+ce(d.signboard)+'>'+esc(d.signboard)+'</td>'
    + '<td class="ctr"'+ce(d.car)+'>'+esc(d.car)+'</td>'
    + '<td class="ctr"'+ce(d.driver)+'>'+esc(d.driver)+'</td>'
    + '<td class="ctr"'+ce(d.phone)+'>'+esc(d.phone)+'</td>'
    + '</tr></tbody></table></div>';

  html += '<div class="footer-note">※ ご不明な点は担当者までご連絡ください。</div>';
  return html;
}

function getShijisaki() {
  function t(id) { var e = document.getElementById(id); return e ? e.textContent.trim() : ''; }
  return { company: t('sj-company'), tel: t('sj-tel'), person: t('sj-person'), addr: t('sj-addr') };
}

function loadHistory() {
  document.getElementById('sh-overlay').style.display = 'block';
  document.getElementById('sh-modal').style.display = 'block';
  document.getElementById('sh-list').innerHTML = '<div style="text-align:center;padding:20px;color:#888;">読み込み中…</div>';
  google.script.run
    .withSuccessHandler(renderHistory)
    .withFailureHandler(function(e) { document.getElementById('sh-list').innerHTML = '<div style="color:red;">エラー: ' + e.message + '</div>'; })
    .getShijisakiHistory(DATA.client, DATA.ssId);
}

function renderHistory(list) {
  window._sjHistory = list;
  if (!list || list.length === 0) {
    document.getElementById('sh-list').innerHTML = '<div style="text-align:center;padding:20px;color:#888;">履歴がありません</div>';
    return;
  }
  var h = '<table style="width:100%;border-collapse:collapse;"><thead><tr style="background:#455a64;color:#fff;">'
    + '<th style="padding:6px 8px;text-align:left;white-space:nowrap;">会社名</th>'
    + '<th style="padding:6px 8px;text-align:left;white-space:nowrap;">電話番号</th>'
    + '<th style="padding:6px 8px;text-align:left;white-space:nowrap;">担当者名</th>'
    + '<th style="padding:6px 8px;text-align:left;">住所</th>'
    + '<th style="padding:6px 8px;text-align:left;white-space:nowrap;">最終使用</th>'
    + '<th style="width:44px;"></th>'
    + '</tr></thead><tbody>';
  list.forEach(function(r, i) {
    h += '<tr style="cursor:pointer;border-bottom:1px solid #eee;" '
      + 'onmouseover="this.style.background=\'#e3f2fd\'" onmouseout="this.style.background=\'\'" '
      + 'onclick="pickHistory(' + i + ')">'
      + '<td style="padding:5px 8px;">' + esc(r.company) + '</td>'
      + '<td style="padding:5px 8px;">' + esc(r.tel) + '</td>'
      + '<td style="padding:5px 8px;">' + esc(r.person) + '</td>'
      + '<td style="padding:5px 8px;">' + esc(r.addr) + '</td>'
      + '<td style="padding:5px 8px;color:#888;font-size:10px;">' + esc(r.lastUsed) + '</td>'
      + '<td style="padding:3px 4px;text-align:center;">'
      + '<button type="button" onclick="event.stopPropagation();deleteHistory(' + i + ')" '
      + 'style="padding:2px 7px;background:#c62828;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:10px;">削除</button>'
      + '</td>'
      + '</tr>';
  });
  document.getElementById('sh-list').innerHTML = h + '</tbody></table>';
}

function deleteHistory(i) {
  if (!confirm('この履歴を削除しますか？')) return;
  var r = window._sjHistory[i];
  google.script.run
    .withSuccessHandler(function() {
      window._sjHistory.splice(i, 1);
      renderHistory(window._sjHistory);
    })
    .withFailureHandler(function(err) { alert('削除に失敗しました: ' + err.message); })
    .deleteShijisakiHistory(DATA.client, r.company, r.tel, r.person, r.addr, DATA.ssId);
}

function pickHistory(i) {
  var r = window._sjHistory[i];
  document.getElementById('sj-company').textContent = r.company;
  document.getElementById('sj-tel').textContent = r.tel;
  document.getElementById('sj-person').textContent = r.person;
  document.getElementById('sj-addr').textContent = r.addr;
  closeHistory();
  markUnsaved();
}

var _hasUnsaved = false;
function markUnsaved() { _hasUnsaved = true; }

function onSaveShijisaki() {
  var sj = getShijisaki();
  var btn = document.getElementById('btn-save-sj');
  if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
  google.script.run
    .withSuccessHandler(function() {
      _hasUnsaved = false;
      if (btn) { btn.disabled = false; btn.textContent = '✅ 保存完了'; setTimeout(function(){ btn.textContent = '💾 保存'; }, 2000); }
    })
    .withFailureHandler(function(err) {
      if (btn) { btn.disabled = false; btn.textContent = '💾 保存'; }
      alert('保存に失敗しました: ' + err.message);
    })
    .saveShijisakiByRowId(DATA.id, sj, DATA.client, DATA.ssId);
}

function requestClose() {
  if (_hasUnsaved) {
    document.getElementById('close-overlay').style.display = 'block';
    document.getElementById('close-confirm').style.display = 'block';
  } else {
    google.script.host.close();
  }
}

function saveAndClose() {
  var sj = getShijisaki();
  google.script.run
    .withSuccessHandler(function() { _hasUnsaved = false; google.script.host.close(); })
    .withFailureHandler(function() { google.script.host.close(); })
    .saveShijisakiByRowId(DATA.id, sj, DATA.client, DATA.ssId);
}

function discardAndClose() {
  _hasUnsaved = false;
  google.script.host.close();
}

function cancelClose() {
  document.getElementById('close-overlay').style.display = 'none';
  document.getElementById('close-confirm').style.display = 'none';
}

window.addEventListener('beforeunload', function(e) {
  if (_hasUnsaved) { e.preventDefault(); e.returnValue = ''; return ''; }
});

function closeHistory() {
  document.getElementById('sh-overlay').style.display = 'none';
  document.getElementById('sh-modal').style.display = 'none';
}

function onPrint() {
  window.print();
  if (TYPE === 'hatchu') {
    var sj = getShijisaki();
    if (sj.company || sj.tel || sj.person || sj.addr) {
      google.script.run.saveShijisakiHistory(DATA.client, sj, DATA.ssId);
    }
  }
  google.script.run.markDocumentIssued(DATA.id, TYPE);
}

function onEmailSend() {
  if (!DATA.clientEmail) {
    alert('メールアドレスが未登録です。\nマスタシートのQ列にメールアドレスを登録してください。');
    return;
  }
  if (!confirm('この宛先に送信してもよろしいですか？\n\n宛先：' + DATA.clientEmail)) return;
  var btn = document.getElementById('btn-email');
  btn.disabled = true; btn.textContent = '送信中...';
  if (TYPE === 'hatchu') DATA.shijisaki = getShijisaki();
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.ok) {
        _hasUnsaved = false;
        alert(r.msg);
        btn.textContent = '✅ 送信完了'; btn.className = 'tbtn tbtn-sent';
      } else {
        alert((r && r.msg) || '送信に失敗しました。');
        btn.disabled = false; btn.textContent = '✉️ メール送信';
      }
    })
    .withFailureHandler(function(e) {
      alert('エラー: ' + e.message);
      btn.disabled = false; btn.textContent = '✉️ メール送信';
    })
    .sendDocumentEmail(DATA, TYPE, 'email');
}

function onFaxSend() {
  if (!DATA.clientFax) {
    alert('FAX番号が未登録です。\nマスタシートのD列にFAX番号を登録してください。');
    return;
  }
  if (!confirm('この宛先にFAX送信してもよろしいですか？\n\n宛先：' + DATA.clientFax)) return;
  var btn = document.getElementById('btn-fax');
  btn.disabled = true; btn.textContent = '送信中...';
  if (TYPE === 'hatchu') DATA.shijisaki = getShijisaki();
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.ok) {
        _hasUnsaved = false;
        alert(r.msg);
        btn.textContent = '✅ 送信完了'; btn.className = 'tbtn tbtn-sent';
      } else {
        alert((r && r.msg) || '送信に失敗しました。');
        btn.disabled = false; btn.textContent = '📠 FAX送信';
      }
    })
    .withFailureHandler(function(e) {
      alert('エラー: ' + e.message);
      btn.disabled = false; btn.textContent = '📠 FAX送信';
    })
    .sendDocumentEmail(DATA, TYPE, 'fax');
}

(function(){
  var isHatchu = (TYPE === 'hatchu');
  document.getElementById('doc-type-label').textContent = isHatchu ? '発注書・指示書' : '車番連絡';
  document.getElementById('page').innerHTML = buildDoc(DATA, isHatchu);
  if (isHatchu) {
    google.script.run
      .withSuccessHandler(function(d) {
        if (!d) return;
        document.getElementById('sj-company').textContent = d.company||'';
        document.getElementById('sj-tel').textContent     = d.tel    ||'';
        document.getElementById('sj-person').textContent  = d.person ||'';
        document.getElementById('sj-addr').textContent    = d.addr   ||'';
      })
      .getShijisakiByRowId(DATA.id, DATA.ssId);
  }
})();
</script>
</body>
</html>
