<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>利用規約 - 運行管理システム</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: #f5f5f5; margin: 0; padding: 16px; color: #333; line-height: 1.6;
    }
    .container {
      max-width: 640px; margin: 0 auto; background: #fff;
      border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }
    h1 { font-size: 20px; margin: 0 0 6px; color: #1a73e8; }
    .company-label { font-size: 13px; color: #666; margin-bottom: 24px; }
    .doc-links {
      background: #fafafa; border: 1px solid #ddd; border-radius: 4px;
      padding: 16px 20px; margin-bottom: 20px;
    }
    .doc-links p { margin: 0 0 10px; font-size: 13px; color: #555; }
    .doc-links a {
      display: block; color: #1a73e8; font-size: 14px; font-weight: bold;
      text-decoration: none; padding: 6px 0;
    }
    .doc-links a:hover { text-decoration: underline; }
    .doc-links a + a { border-top: 1px solid #eee; margin-top: 4px; padding-top: 10px; }
    .agree-check {
      display: flex; align-items: flex-start; gap: 10px;
      background: #e8f0fe; border: 1px solid #1a73e8; border-radius: 6px;
      padding: 14px 16px; margin-bottom: 20px; cursor: pointer;
    }
    .agree-check input[type="checkbox"] {
      width: 18px; height: 18px; margin-top: 1px; flex-shrink: 0; cursor: pointer;
    }
    .agree-check label { font-size: 14px; font-weight: bold; cursor: pointer; }
    .agree-btn {
      background: #1a73e8; color: #fff; border: none; border-radius: 6px;
      padding: 14px 0; font-size: 16px; font-weight: bold;
      cursor: pointer; width: 100%; letter-spacing: 0.05em;
    }
    .agree-btn:disabled { background: #aaa; cursor: not-allowed; }
    .loading-msg { display: none; color: #666; font-size: 13px; margin-top: 10px; text-align: center; }
    .done-wrap   { display: none; text-align: center; padding: 24px 0; }
    .done-icon   { font-size: 52px; margin-bottom: 8px; }
    .done-wrap h2 { color: #188038; margin: 0 0 10px; }
    .done-wrap p  { font-size: 14px; color: #555; margin: 0; }
  </style>
</head>
<body>
<div class="container">

  <div id="mainContent">
    <h1>運行管理システム 利用規約への同意</h1>
    <div class="company-label">対象会社：<?= companyName ?> 御中</div>

    <div class="doc-links">
      <p>ご契約の前に、必ず以下の文書をお読みください。</p>
      <a href="<?= appUrl ?>?page=terms" target="_blank" rel="noopener">📄 利用規約を確認する</a>
      <a href="<?= appUrl ?>?page=privacy" target="_blank" rel="noopener">📄 プライバシーポリシーを確認する</a>
    </div>

    <label class="agree-check">
      <input type="checkbox" id="agreeCheck" onchange="toggleBtn()">
      <span>利用規約およびプライバシーポリシーを確認し、すべての内容に同意します</span>
    </label>

    <button id="agreeBtn" type="button" class="agree-btn" onclick="doAgree()" disabled>同意して続ける</button>
    <div id="loadingMsg" class="loading-msg">処理中...しばらくお待ちください</div>
  </div>

  <div id="doneContent" class="done-wrap">
    <div class="done-icon">✅</div>
    <h2>同意が完了しました</h2>
    <p>ご同意ありがとうございます。<br>
    スプレッドシートとアプリのURLを<br>
    メールでお送りしましたのでご確認ください。</p>
  </div>

</div>
<script>
  var SSID         = '<?= companySsId ?>';
  var COMPANY_NAME = '<?= companyName ?>';
  var CONTRACT_ROW = '<?= contractRow ?>';

  function toggleBtn() {
    var checked = document.getElementById('agreeCheck').checked;
    document.getElementById('agreeBtn').disabled = !checked;
  }

  function doAgree() {
    if (!document.getElementById('agreeCheck').checked) return;
    document.getElementById('agreeBtn').disabled = true;
    document.getElementById('mainContent').style.display = 'none';
    document.getElementById('doneContent').style.display = 'block';
    google.script.run.agreeContract(SSID, COMPANY_NAME, '', CONTRACT_ROW, '');
  }
</script>
</body>
</html>
